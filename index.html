<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>食材期限管理アプリ</title>
    <link rel="stylesheet" href="style.css">
    <link rel="manifest" href="manifest.webmanifest">
    <meta name="theme-color" content="#0b201f">
</head>
<body>
    <header>
        <h1>食材リスト</h1>
        <div style="display:flex; gap:10px;">
            <button id="installBtn" hidden>アプリをインストール</button>
            <button id="logoutBtn" class="danger">ログアウト</button>
        </div>
    </header>

    <main>
        <!-- 食材登録セクション -->
        <section class="card">
            <h2>食材登録</h2>
            <div class="form-row">
                <label>名前</label>
                <div style="display:flex; gap:8px; width:100%;">
                    <input type="text" id="name" placeholder="例: 牛乳" list="nameHistory" autocomplete="off">
                    <datalist id="nameHistory"></datalist>
                    <button id="voiceBtn" class="icon-btn" title="音声入力">🎤</button>
                </div>
            </div>
            <div class="form-row">
                <label>数量</label>
                <!-- 修正: step="1" min="1" で整数のみ許可 -->
                <input type="number" id="qty" value="1" min="1" step="1" placeholder="1">
            </div>
            <div class="form-row">
                <label>期限</label>
                <input type="date" id="date">
            </div>
            <div class="actions">
                <button id="add">追加</button>
            </div>
            <div class="note">※期限未入力時は本日+3日後、音声入力は「キャベツ 1個」のように話してください</div>
        </section>

        <!-- カレンダーセクション -->
        <section class="card">
            <div class="calendar-header">
                <button id="prevMonthBtn">&lt;</button>
                <h2 id="monthYear">----年 --月</h2>
                <button id="nextMonthBtn">&gt;</button>
            </div>
            <div id="calendar" class="calendar-grid"></div>
            <div class="note" style="margin-top:10px; text-align:center;">
                アイテムを日付へドラッグ＆ドロップで期限変更可能
            </div>
        </section>

        <!-- リスト表示セクション -->
        <section class="card">
            <div class="list-header">
                <h2>期限リスト</h2>
            </div>
            <div id="list" class="list"></div>
        </section>

        <!-- AIレシピ提案セクション -->
        <section class="card">
            <h2>AIレシピ提案 (Gemini)</h2>
            <div class="form-row">
                <label>APIキー</label>
                <input type="password" id="apiKey" placeholder="Gemini API Keyを入力">
            </div>
            <div class="actions">
                <button id="suggestBtn" style="background: linear-gradient(45deg, #4f46e5, #ec4899);">レシピを考える 🍳</button>
            </div>
            <div id="recipeOutput" style="display:none; margin-top:16px;"></div>
        </section>

        <!-- 設定・デバッグセクション -->
        <section class="card">
            <h2>管理メニュー</h2>
            <div class="actions">
                <button id="testNotify">通知テスト</button>
                <button id="clearAllBtn" class="danger">全データ削除</button>
            </div>
        </section>
    </main>

    <footer>
        &copy; Food Alert App
    </footer>

    <!-- 編集用モーダルダイアログ -->
    <dialog id="editDialog">
        <h2>編集</h2>
        <div class="form-row">
            <label>名前</label>
            <input type="text" id="editName">
        </div>
        <div class="form-row">
            <label>数量</label>
            <!-- 修正: step="1" で整数のみ許可 -->
            <input type="number" id="editQty" min="0" step="1">
        </div>
        <div class="form-row">
            <label>期限</label>
            <input type="date" id="editDate">
        </div>
        <div class="actions" style="justify-content: flex-end; margin-top: 20px;">
            <button id="cancelEditBtn" style="background: #4b5563;">キャンセル</button>
            <button id="saveEditBtn">保存</button>
        </div>
    </dialog>

    <script src="app.js"></script>
</body>
</html>
